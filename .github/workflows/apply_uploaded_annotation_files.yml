name: Apply uploaded annotation files

on:
  push:
    branches:
      - codex/explain-pure-opd-multitask
    paths:
      - .codex_upload/READY

permissions:
  contents: write

concurrency:
  group: apply-uploaded-annotation-files
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: codex/explain-pure-opd-multitask
          fetch-depth: 0

      - name: Decode and validate uploaded files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p docs/code_explanation/annotated/verl/trainer/ppo
          mkdir -p docs/code_explanation/annotated/verl/trainer

          cat .codex_upload/ray_trainer.py.b64.* | tr -d '\n' | base64 --decode > docs/code_explanation/annotated/verl/trainer/ppo/ray_trainer.py
          cat .codex_upload/main_ppo.py.b64.* | tr -d '\n' | base64 --decode > docs/code_explanation/annotated/verl/trainer/main_ppo.py
          cat .codex_upload/skillsd_ray_trainer.py.b64.* | tr -d '\n' | base64 --decode > docs/code_explanation/annotated/verl/trainer/ppo/skillsd_ray_trainer.py

          cat <<'EOF' | sha256sum -c -
          1b6e3d19cf543dff46d59fe7b0a736c51de132cb6a0cfa5e716c528a958c09d8  docs/code_explanation/annotated/verl/trainer/ppo/ray_trainer.py
          68f5c3f0820d963eded83d53573b2ac12313e6c45a20fbce718ca7a47c56031d  docs/code_explanation/annotated/verl/trainer/main_ppo.py
          ca9a6a951d705614e4d67cbeafa7d1cf4befe9579574a327a9517137fee454c9  docs/code_explanation/annotated/verl/trainer/ppo/skillsd_ray_trainer.py
          EOF

          python -m py_compile \
            docs/code_explanation/annotated/verl/trainer/ppo/ray_trainer.py \
            docs/code_explanation/annotated/verl/trainer/main_ppo.py \
            docs/code_explanation/annotated/verl/trainer/ppo/skillsd_ray_trainer.py

      - name: Commit annotation examples
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf .codex_upload
          rm -f .github/workflows/apply_uploaded_annotation_files.yml

          git add \
            docs/code_explanation/annotated/verl/trainer/ppo/ray_trainer.py \
            docs/code_explanation/annotated/verl/trainer/main_ppo.py \
            docs/code_explanation/annotated/verl/trainer/ppo/skillsd_ray_trainer.py \
            .codex_upload \
            .github/workflows/apply_uploaded_annotation_files.yml

          git commit -m "docs(annotation): add detailed Japanese trainer comments"
          git push origin HEAD:codex/explain-pure-opd-multitask
