# Expected effective config for the OPD + GRPO multitask run with a PER-TASK
# OPD COEFFICIENT -- arm: tdist_lam.
#
# This file is the machine-readable INTENT of the experiment. main_opd_grpo
# validates the composed Hydra config against every key below AFTER its own
# config injection (verl/utils/expected_config.py) and aborts on any mismatch,
# so a wrong default / typo'd override / shadowed injection fails in seconds
# instead of producing a mislabeled multi-hour run.
#
# THE THREE ARMS DIFFER IN NOTHING BUT b. That is the entire claim the
# comparison rests on, so it is not left to reading three files side by side:
# tests/trainer/test_opd_coef_arm.py diffs them and fails on any key other than
# teacher_kl_loss_coef_by_task.* and the run's own name.
#
#   control       b = (1, 1, 1)          -- the key is ABSENT, not {1,1,1}
#   uniform       b = 1.110833 each
#   redistribute  b = (1.076431, 1.191101, 0.500000)
#
# Where b comes from, and the six things it does not establish:
# docs/opd_coefficient_arm_design.md.
#
# Rules:
#   - Keys are dotted paths into the composed config; values are the expected
#     effective values.
#   - Only SCIENTIFIC knobs live here (they define what the experiment *is*).
#     Performance knobs (micro batch sizes, offload, prefix caching,
#     max_model_len, gpu_memory_utilization, ...) are intentionally NOT listed
#     so machine tuning never requires touching this file. $HOME-derived data
#     paths are also not pinned (machine-dependent).
#   - To change a setting intentionally: edit the run script AND this file in
#     the same commit. A run-script-only edit will (by design) refuse to start.

# ---- distillation loss (the knob that caused the original low_var_kl mishap) --
"algorithm.opd.kl_loss_type": topk_kl
"algorithm.opd.kl_loss_coef": 0.01
"algorithm.opd.topk": 20
# Per-task normalisation of the teacher-KL loss. The plain token-mean weights a
# task by its share of response tokens, measured at 69/27/4% for
# alfworld/webshop/search on this mixture purely because of the 50/15/4-turn
# episode caps; the per-row weights in attach_task_loss_weights make it 1/3 each.
# Data composition, batch sizes and step count are untouched, so this arm still
# differs from the SFT and offline-KD arms in nothing but the loss -- which is
# exactly why it is pinned: the three arms must agree on it or the comparison
# confounds the objective with the task weighting.
"algorithm.opd.normalize_loss_by_task": true
# effective values after main_opd's injection into the actor config
"actor_rollout_ref.actor.use_teacher_kl_loss": true
"actor_rollout_ref.actor.teacher_kl_loss_type": topk_kl
# 0.01, against 1.0 on every earlier arm. A 100x change to the teacher-KL term,
# pinned here because it is the reason no existing run is a baseline for this
# one: the arm REDISTRIBUTES that term, and at 1.0 the redistribution competes
# with the policy gradient instead of shaping it. The control run carries the
# same value and differs only in cross_teacher_kl_weight.enable.
"actor_rollout_ref.actor.teacher_kl_loss_coef": 0.01
"actor_rollout_ref.actor.teacher_kl_topk": 20
"actor_rollout_ref.actor.normalize_loss_by_task": true

# ---- the objective: GRPO policy gradient + per-task teacher KL ----------------
# policy_loss = pg_loss * pg_loss_coef + teacher_kl_loss * teacher_kl_loss_coef.
# pg_loss_coef is the single number this arm differs from the pure-OPD one by, so
# it is the most important line in this file: at 0 the two arms are the same run.
# main_opd_grpo refuses to start without it set, and this lock is what says which
# value the run was supposed to have.
# ZERO, and this is the arm rather than a shared setting: MOPD v3 puts the
# reward in the distillation target, so leaving the policy-gradient term on
# would count it twice. validate_target_distill_exclusivity refuses that.
"actor_rollout_ref.actor.pg_loss_coef": 0.0
# grpo, and required rather than incidental: the policy gradient reads
# group-relative advantages, so the estimator is part of the objective here. On
# the pure-OPD arm the same line is inert -- no advantages are ever computed --
# and is pinned only to keep the two configs comparable.
"algorithm.adv_estimator": grpo
# The env score is the only thing shaping the advantages: no reference-KL penalty
# is mixed into the reward, and no reference-KL term is in the loss either.
"algorithm.use_kl_in_reward": false
"actor_rollout_ref.actor.use_kl_loss": false
"actor_rollout_ref.actor.entropy_coeff": 0
"actor_rollout_ref.actor.use_sdl_loss": false
"actor_rollout_ref.actor.use_sdar_loss": false
"actor_rollout_ref.actor.use_invalid_action_penalty": true
"actor_rollout_ref.actor.invalid_action_penalty_coef": 0.1
"actor_rollout_ref.actor.invalid_action_penalty_coef_by_task":
  alfworld: 0.1
  search: 0.01
  webshop: 0.1

# ---- teachers -------------------------------------------------------------------
"algorithm.opd.teacher_paths.alfworld": "$HOME/checkpoints/teachers/alfworld_step300"
"algorithm.opd.teacher_paths.search": "$HOME/checkpoints/teachers/search_step300"
"algorithm.opd.teacher_paths.webshop": "$HOME/checkpoints/teachers/webshop_step300"

# ---- model / optimization -------------------------------------------------------
"actor_rollout_ref.model.path": Qwen/Qwen3-1.7B
"actor_rollout_ref.actor.optim.lr": 1.0e-6
"actor_rollout_ref.actor.optim.lr_warmup_steps_ratio": 0.1
"actor_rollout_ref.actor.ppo_mini_batch_size": 60
# Throughput knobs that nonetheless sit on the GRADIENT path, so they are pinned
# here even though the rule above exempts performance settings. ZeRO-2 is
# arithmetic-neutral; no_sync_grad_accum reduces once per mini-batch instead of
# once per micro-batch, which reorders the partial sums (same expectation,
# different last bits). Neither may change silently between runs.
"actor_rollout_ref.actor.fsdp_config.sharding_strategy": shard_grad_op
"actor_rollout_ref.actor.no_sync_grad_accum": true
# response_only_logits is pinned for the same reason. Restricting lm_head to the
# response rows computes exactly the values the full projection did -- lm_head is
# per-position, so selecting before or after it is the same arithmetic -- but the
# GEMM changes shape, which moves the last bits like a micro-batch change does.
# It also sits on both the student's gradient and the teacher's targets, so the
# two must not diverge between compared runs.
"actor_rollout_ref.actor.response_only_logits": true
"actor_rollout_ref.ref.response_only_logits": true
# student_indexed_topk is pinned because it is not a performance knob at all: it
# decides which 20 tokens the coarse-grained KL is exact on. Reverse KL weights
# by the student's mass and the term it drops is tail_s * KL(p_s|A-bar || p_t|A-bar),
# so a support taken from the student covers the student's mass and a support
# taken from the teacher does not. Both are lower bounds on the same full KL, so
# the two settings are different (valid) objectives -- comparing arms across them
# compares nothing. ref.student_indexed_topk follows the actor's value in
# ppo_trainer.yaml and so is not listed separately.
"actor_rollout_ref.actor.student_indexed_topk": true
# enable_gradient_checkpointing sits on the gradient path even though it looks
# like a pure memory knob: a recomputed forward and a stored one differ in their
# last bits under autocast, the same class as no_sync_grad_accum. It is pinned
# ON. Turning it off is worth ~a third of actor.bwd, but it was measured: with it
# off, step 1 OOMed in its first micro-batch on a 94.97 GiB card, so the ~13 GB of
# activations it would keep does not exist. (Do not re-derive that headroom from
# perf/max_memory_*: both of those high-water marks have printed values larger
# than the card, because vLLM's allocator pool is counted by torch while its
# pages are mapped and unmapped underneath. See the run script.)
"actor_rollout_ref.model.enable_gradient_checkpointing": true
# rollout.log_prob_micro_batch_size_per_gpu is pinned for a reason that only
# half concerns log probs. This arm DOES run compute_log_prob (the policy
# gradient needs old_log_prob), so the value sizes a real forward -- but that
# part is throughput and would be exempt. What puts it in this file is its other
# effect: it sets adjust_batch's divisor, lcm(rollout*2, rollout*2, actor*2). At
# 16 that is 160 and step 1 threw away 116 rows to reach it; at 10 it is 20.
# Which rows get dropped is data. It must also match the pure-OPD arm's value,
# or the two arms are not training on the same rows.
"actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu": 10
# ---- what bounds the training forward ----------------------------------------
# Raised 5 -> 10 on 2026-09-08. It had been halved from 10 after this arm's
# first launch because the hidden-state cache held four models per row
# (teacher_cache/gb 16.3 against pure OPD's 4.1) while vLLM was awake and
# holding its KV cache. NEITHER condition holds now: teacher_cache/gb measures
# 3.673 with teacher_cache/device_gb 0.000 (host RAM, not device), and vLLM
# sleeps before the update -- 95.5 GB during the rollout, 30.0 GB between
# phases, 53.6/45.6 GB of 97.9 during the update, so 44 GB is free where the
# original OOM was recorded.
# The motive for raising it is the per-micro-batch parameter all-gather. This
# host has no NVLink: `nvidia-smi topo -m` reports SYS between GPU0 and GPU1,
# on different NUMA nodes. SHARD_GRAD_OP therefore moves 1.89 GiB per
# micro-batch, and at the measured 564 micro-batches per rank per step that is
# 1,066 GiB. Sampled rxpci averages 4.6-5.1 GB/s against the 5.34 GB/s that
# volume requires, so the gather is essentially all of the update phase's PCIe
# traffic; halving the count is worth 20-27 s/step.
# Unlike the rollout key above it does NOT enter adjust_batch's divisor, so it
# moves no rows and drops no data. What it changes is floating-point summation
# order, which is why every compared arm has to carry the same value.
"actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu": 10

# NOT pinned, and deliberately so:
#   ref.fsdp_config.{param_offload,sharding_strategy} -- placement only,
#     bit-identical, covered by the exemption above.
#   rollout.return_rollout_log_probs -- True on this arm because the drift check
#     (rollout_probs_diff) reads it, but it is a diagnostic: the sampled tokens
#     and everything that reaches the loss are identical either way.
#   rollout.disable_log_stats -- logging volume only.
#   ROLLOUT_PREFETCH_TEACHER_{CHUNK,CHUNK_MAX,ADAPTIVE} -- these only decide how
#     many already-final rows one prefetch call scores, so like the chunk size
#     they cannot change a value.
# Speculative decoding WOULD belong here (it sits on the sampling path, so it
# must not differ silently between compared runs) but it cannot run on this stack
# at all -- see the run script for why -- so there is nothing to pin.

# ---- data -----------------------------------------------------------------------
"data.train_batch_size": 45
"data.val_batch_size": 126
"data.seed": 1
"data.max_prompt_length": 4096
"data.max_response_length": 512
"data.truncation": left
"data.task_balance.enable": true
"data.task_balance.per_task_batch_size": 15
"data.task_balance.num_batches": 300
"data.task_balance.tasks": [alfworld, search, webshop]
"data.task_overrides.alfworld.max_prompt_length": 2048
"data.task_overrides.alfworld.truncation": error
"data.task_overrides.search.max_prompt_length": 4096
"data.task_overrides.search.truncation": left
"data.task_overrides.webshop.max_prompt_length": 4096
"data.task_overrides.webshop.truncation": error
"data.apply_chat_template_kwargs.enable_thinking": false

# ---- environment ------------------------------------------------------------------
"env.env_name": multitask
"env.seed": 1
"env.max_steps": 50
"env.history_length": 4
"env.rollout.n": 8
"env.multitask.tasks": [alfworld, search, webshop]
"env.multitask.max_steps.alfworld": 50
"env.multitask.max_steps.search": 4
"env.multitask.max_steps.webshop": 15
"env.multitask.history_length.alfworld": 2
"env.multitask.history_length.search": 4
"env.multitask.history_length.webshop": 2
# search only. Every search row carries its own question and ground_truth, so a
# wider batch scores the same episodes; alfworld must NOT be widened -- its
# games are drawn from a seeded cycle indexed by a row's position within its
# manager, so changing its size plays different games, silently. Tasks not
# named here keep data.val_batch_size, which is pinned at 126 above.
"env.multitask.val_per_task_batch_size.search": 252
# On an exhausted retry budget the client does NOT fail the run: the error text is
# substituted for the retrieved document and becomes the <information> block the
# model sees, with nothing in the metrics to say so. That makes the retry policy a
# property of the DATA, which is why it is pinned here rather than left with the
# performance knobs. max_retries: null retries a timeout / refused connection / 5xx
# until the retriever answers, so no turn can be trained on an error string; 4xx and
# malformed JSON still fail at once, since waiting cannot turn those into a document.
#
# timeout is generous but finite on purpose. null would also wait, but a connection
# that dies without being closed (a retriever restart) then blocks forever with
# nothing to detect it -- and the rollout's turn barrier waits on the slowest env, so
# one dead socket stalls every trajectory in the step. A finite timeout turns that
# into one more retry against the restarted server.
"env.search.timeout": 600
"env.search.max_retries": null

# ---- rollout sampling / validation protocol ----------------------------------------
"actor_rollout_ref.rollout.temperature": 1.0
"actor_rollout_ref.rollout.val_kwargs_by_task.alfworld.temperature": 0.4
"actor_rollout_ref.rollout.val_kwargs_by_task.alfworld.do_sample": true
"actor_rollout_ref.rollout.val_kwargs_by_task.search.temperature": 0
"actor_rollout_ref.rollout.val_kwargs_by_task.search.do_sample": false
"actor_rollout_ref.rollout.val_kwargs_by_task.webshop.temperature": 0.4
"actor_rollout_ref.rollout.val_kwargs_by_task.webshop.do_sample": true

# ---- speculative decoding (pinned although engine knobs are exempt) ----------
# ON, because this arm belongs to the CROSS family (control + cross), and the
# two arms of a comparison have to sample the same way. It is not covered by
# the performance-knob exemption at the top of this file: it changes which
# tokens are SAMPLED. Rejection sampling preserves the target distribution --
# vLLM's RejectionSampler follows 2211.17192, the n-gram proposer supplies no
# draft probabilities so the draft is deterministic and accept-plus-recover is
# exact, and training samples at temperature 1.0 with no top_p or top_k, the
# one case vLLM's own docstring says spec decode does not support. What changes
# is which tokens get drawn, the same class as enable_prefix_caching=True and
# enforce_eager=False, which are already on here and in the August baseline.
# acceptance_method is pinned rather than left to a default a vLLM upgrade
# could move.
# The three arms of the coefficient family pin this to null instead: the live
# pushback run and the August baseline (wandb ktrcnege) both sampled without
# it. That is also why the coefficient family has no in-file control any more.
# Not yet run on a GPU: coexistence with sleep mode and the rollout pump is
# unverified, and the failure mode is a startup crash.
"actor_rollout_ref.rollout.engine_kwargs.vllm.speculative_config.method": ngram
"actor_rollout_ref.rollout.engine_kwargs.vllm.speculative_config.num_speculative_tokens": 4
"actor_rollout_ref.rollout.engine_kwargs.vllm.speculative_config.prompt_lookup_min": 2
"actor_rollout_ref.rollout.engine_kwargs.vllm.speculative_config.prompt_lookup_max": 5
"actor_rollout_ref.rollout.engine_kwargs.vllm.speculative_config.acceptance_method": rejection_sampler

# ---- run identity ------------------------------------------------------------------
# PINNED, because the three arms are only comparable if they ran on the same
# hardware. The rollouts are SAMPLED: a different GPU count changes the FSDP
# sharding and the vLLM batching, so the same seed does not give the same
# trajectories. The objective itself is invariant (the per-task row weights
# carry the whole normalisation and the world-size/accumulation factors
# cancel), so what a move to another machine changes is the sampling -- which
# is enough, and which nothing else in this file would have caught.
"trainer.n_gpus_per_node": 2
# NO VALIDATION INSIDE TRAINING. Pinned, not left as a performance knob:
# training alone peaks at 183 GB of 251 GB on this host and the validation pass
# adds its own environments for 126 instances a task, which has exhausted host
# RAM before -- and the loop validates BEFORE it saves
# (opd_ray_trainer.py:1579 then :1586), so that OOM would take the step-150
# checkpoint with it. The evaluations are separate VAL_ONLY runs off the saved
# checkpoints. -1 disables the last-step validation as well.
"trainer.test_freq": -1
# 12 saves at 25-step intervals, so 150 and 300 are both on disk to evaluate.
"trainer.save_freq": 25
# 300, matching every other beta=0.01 arm in this project. The total is the
# cosine schedule's denominator, so it is not a duration knob: at step 150 a
# 150-step run has decayed to zero while a 300-step run is at 59% of peak,
# and the mean learning rate over the first 150 steps differs by 1.56x. Pinned
# because that difference is orders larger than b's first-order contribution,
# so an arm on the wrong schedule is not a control for one on the right one.
"trainer.total_training_steps": 300
"trainer.project_name": verl_agent_opd_grpo_opd_coef$RUN_TAG_SUFFIX
# experiment_name is pinned as part of the run identity: renaming (or reusing a
# name for a different config) requires touching this file next to the knobs.
#
# $RUN_TAG_SUFFIX on both names is the run script's RUN_TAG, resolved out of the
# environment by load_expectations' os.path.expandvars. It is empty when the tag
# is unset, so an untagged run pins exactly the name it always did. What the
# suffix does NOT do is unpin the name: the base is still checked, so a typo
# fails the run in seconds rather than after two hours in the wrong chart.
"trainer.experiment_name": opd_grpo_multitask_opd_coef_tdist_lam_qwen3_1.7b$RUN_TAG_SUFFIX
# ---- cross-teacher sign agreement --------------------------------------------
# THE CONTROL. Same code path, same seed, same rollouts, same 0.01 coefficient;
# the weight is off. It is not an ablation -- it is the only run this arm can be
# compared against, since the coefficient change alone rules out every earlier
# result. Pinned false so a copy-paste cannot quietly turn it into a second
# treatment arm.
"algorithm.opd.cross_teacher_kl_weight.enable": false
# The pre-RL policy every teacher's shift is relative to. It MUST be the exact
# checkpoint all three were fine-tuned from: the cumulative RMS, the
# corroboration and the reliability are all measured against it, so a different
# base makes every number here mean something else. The resume sidecar refuses a
# mismatch for the same reason.
"algorithm.opd.cross_teacher_kl_weight.base_path": Qwen/Qwen3-1.7B
# effective values after main_opd_grpo copies them onto the actor, which is where
# the weight is actually built -- the driver only caches the models it reads.
"actor_rollout_ref.actor.cross_teacher_kl_weight.enable": false
"actor_rollout_ref.actor.cross_teacher_kl_weight.base_path": Qwen/Qwen3-1.7B

# ---- the arm's readout -------------------------------------------------------
# Pinned true on all three arms: the numbers only mean anything as a comparison,
# and an arm that silently ran without them would leave a hole nothing else can
# fill after the fact. verl/trainer/ppo/opd_task_diag.py.
"algorithm.opd.task_diag": true
"actor_rollout_ref.actor.teacher_kl_task_diag": true

# ---- the coefficient vector: THE arm ----------------------------------------
# ABSENT, not (1, 1, 1). dp_actor takes the original expressions when this is
# unset, so the control is the same code path as every run before this branch --
# not a different path that happens to multiply by one.
"actor_rollout_ref.actor.teacher_kl_loss_coef_by_task": null
"algorithm.opd.kl_loss_coef_by_task": null


# ---- MOPD v3: the target IS the arm -----------------------------------------
# L = beta * KL(p_theta || q*) and NOTHING else. pg_loss_coef is 0 on both sides
# of the injection, which the startup validation enforces rather than trusts: with
# the GRPO term left in, the update is r + d + beta F c and the reward reaches the
# parameters twice -- once through the policy gradient and once through the target
# it was used to build. The arm's whole claim is that it does not do that.
#
# q* = softmax(log q + c),  c = eta * alpha * f * e * r  (re-centred, clamped).
#   f  the OPD strength ratio 2s/(s+sbar), 1 at the running mean, 0 where OPD is silent
#   e  the RLSD weight clip(exp(sign(A) dlog), 1-eps, 1+eps) -- softens the penalty on a
#      token the teacher backs inside a FAILED trajectory, which is what the pushback
#      review §9.3 measured GRPO doing wrong
#   alpha  alpha == 1 (no integration).  lambda decays 1 -> 0.1 over steps 50..250:
#          the target's base moves from the teacher toward the student's own
#          detached distribution, so ONLY the teacher term is attenuated --
#          beta would have scaled the RL injection with it. Design section 12.
#
# WHAT IS NOT CLAIMED. eta = 1 is not "the control": the exact equality with pure
# OPD+GRPO needs the 1/p_0 exponent, no clamp and no support approximation, and the
# 1/p_0 form reaches exponents of [-37, +22] on measured data. The bounded log-space
# tilt is used instead and the equality is given up; the control arm is the control.
"algorithm.opd.target_distill.enable": true
"algorithm.opd.target_distill.eta": 1.0
"algorithm.opd.target_distill.epsilon_w": 0.2
"algorithm.opd.target_distill.clamp": 2.0
"algorithm.opd.target_distill.integrate": false
"algorithm.opd.target_distill.ema_decay": 0.8
"algorithm.opd.target_distill.window_steps": 8
"algorithm.opd.target_distill.min_prompts": 4
"algorithm.opd.target_distill.min_pg_prompts": 2
"algorithm.opd.target_distill.min_tokens": 64
"algorithm.opd.target_distill.max_staleness": 2
"algorithm.opd.target_distill.split_seed": 1
"algorithm.opd.target_distill.delta": 1.0e-30
# target_roles is where the target is rewritten at all -- with pg_loss_coef = 0 a
# role outside it gets no reward at all. roles is the subset whose alpha is solved.
"algorithm.opd.target_distill.target_roles": [format, reasoning, env_action, tool_call, tag]
"algorithm.opd.target_distill.roles": [format, env_action]
# lambda moves the target's BASE between the teacher and the student's own
# detached distribution. Lowering beta instead would scale the RL injection with
# it, because beta multiplies both terms of d + beta F c. lambda = 1 takes the
# pre-lambda target path unchanged. lambda_min is PROVISIONAL: revise it once
# arm B reports inject_over_d (= eps), since the crossover is at lambda ~ eps.
"algorithm.opd.target_distill.lambda_decay": true
"algorithm.opd.target_distill.lambda_min": 0.1
"algorithm.opd.target_distill.lambda_begin_step": 50
"algorithm.opd.target_distill.lambda_end_step": 250
"actor_rollout_ref.actor.teacher_kl_target_distill.enable": true
"actor_rollout_ref.actor.teacher_kl_target_distill.eta": 1.0
"actor_rollout_ref.actor.teacher_kl_target_distill.integrate": false
"actor_rollout_ref.actor.teacher_kl_target_distill.clamp": 2.0
"actor_rollout_ref.actor.teacher_kl_target_distill.roles": [format, env_action]
"actor_rollout_ref.actor.teacher_kl_target_distill.target_roles": [format, reasoning, env_action, tool_call, tag]
"actor_rollout_ref.actor.teacher_kl_target_distill.min_prompts": 4
"actor_rollout_ref.actor.teacher_kl_target_distill.min_pg_prompts": 2
"actor_rollout_ref.actor.teacher_kl_target_distill.lambda_decay": true
"actor_rollout_ref.actor.teacher_kl_target_distill.lambda_min": 0.1
# and every other mechanism on the teacher-KL term is declared off
"algorithm.opd.cross_gate": null
"actor_rollout_ref.actor.teacher_kl_cross_gate": null
"algorithm.opd.pushback_control": null
"actor_rollout_ref.actor.teacher_kl_pushback": null
