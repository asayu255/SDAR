# Expected effective config for Stage 2 of multitask SFT (behaviour cloning on
# teacher trajectories): cross-entropy on teacher tokens as the only signal.
#
# main_sft_multitask validates the composed Hydra config against every key
# below AFTER its own config injection (verl/utils/expected_config.py) and
# aborts on any mismatch, so a wrong default / typo'd override / shadowed
# injection fails in seconds instead of producing a mislabeled multi-hour run.
#
# Rules:
#   - Keys are dotted paths into the composed config; values are the expected
#     effective values.
#   - Only SCIENTIFIC knobs live here. Performance knobs (micro batch sizes,
#     offload, prefix caching, max_model_len, ...) are intentionally NOT
#     listed. $HOME-derived paths (parquets, algorithm.sft.data_dir) are also
#     not pinned (machine-dependent).
#     ONE CAVEAT to that rule, worth knowing before tuning:
#     ppo_micro_batch_size_per_gpu is not purely a performance knob on this arm.
#     _step_batch_divisor pads the step batch to ppo_micro * world_size, so the
#     micro size decides how many rows adjust_batch duplicates and therefore how
#     many optimizer steps a batch becomes (measured: 71.5 mini-batches a step at
#     micro=5 on 3 GPUs). It is left unpinned because the effect is small and
#     tuning it is expected -- micro=5 was itself an OOM response, and
#     response_only_logits may buy the headroom to put it back -- but a change to
#     it is not free of the data the way the other performance knobs are.
#     It was never entirely free: the divisor was already an lcm over the micro
#     sizes before this arm narrowed it.
#   - To change a setting intentionally: edit the run script AND this file in
#     the same commit. A run-script-only edit will (by design) refuse to start.
#
# TEACHER POOL. This arm has no generation stage of its own: it reads the pool
# the off-policy KD arm generated, $HOME/.../sdar_multitask/teacher_traj, so the
# two arms differ in the loss and in nothing else -- same trajectories, same
# teachers, same RNG stream. That pool's knobs therefore live with the run that
# produced it (examples/opd_trainer/run_multitask_offpolicy_qwen3.sh), which has
# no expectations file; see the run script's header for what to check by hand
# before starting. It carries the teacher's top-k columns for KD's loss;
# MultiTaskSFTTrainer drops them at load because the NLL never reads them, which
# is a host-RAM decision and does not touch the data the loss sees.

# ---- SFT loss (hard-target sibling of the off-policy top-k teacher-KL) ---------
"algorithm.sft.loss_coef": 1.0
# Epochs the fixed teacher pool is intended to be reused. 300 steps * 120
# trajectories/task against a 36000 pool is exactly one pass. NOTE: nothing reads
# this key -- the horizon is trainer.total_training_steps and the reuse count
# follows from the pool size, which this arm does not control (see TEACHER POOL
# above). It pins the *intent* only; a pool smaller than 36000/task will replay
# and nothing here will catch it.
"algorithm.sft.num_epochs": 1
# Per-task normalisation of the SFT loss. The plain token-mean weights a task by
# its share of response tokens, measured at 69/27/4% for alfworld/webshop/search
# on these pools purely because of the 50/15/4-turn episode caps; the per-row
# weights in _attach_sft_loss_weights make it 1/3 each. Data composition, pool
# sizes and epoch counts are untouched, so this arm still differs from off-policy
# KD in nothing but the loss.
"actor_rollout_ref.actor.use_sft_loss": true
# effective values after main_sft_multitask's injection into the actor config
"actor_rollout_ref.actor.sft_loss_coef": 1.0
"actor_rollout_ref.actor.use_teacher_kl_loss": false

# ---- pure-SFT invariants (no other signal enters the loss) ---------------------
"algorithm.adv_estimator": grpo
"algorithm.use_kl_in_reward": false
"actor_rollout_ref.actor.pg_loss_coef": 0
"actor_rollout_ref.actor.use_kl_loss": false
"actor_rollout_ref.actor.entropy_coeff": 0
"actor_rollout_ref.actor.use_sdl_loss": false
"actor_rollout_ref.actor.use_sdar_loss": false
"actor_rollout_ref.actor.use_invalid_action_penalty": true
"actor_rollout_ref.actor.invalid_action_penalty_coef": 0.1
"actor_rollout_ref.actor.invalid_action_penalty_coef_by_task":
  alfworld: 0.1
  search: 0.01
  webshop: 0.1

# ---- FSDP sharding ----------------------------------------------------------------
# ZeRO-2 rather than the FULL_SHARD default: parameters stay gathered from the
# forward through the backward, so the repeated all-gathers a layer does per
# micro-batch under gradient checkpointing collapse to one. Listed here despite
# being a throughput knob because it is on the gradient path, and a run's identity
# should not depend on something invisible to this file. It is arithmetic-neutral
# -- gradients are reduce-scattered in the same reduce_dtype either way -- so the
# three arms may adopt it independently without confounding their comparison.
"actor_rollout_ref.actor.fsdp_config.sharding_strategy": shard_grad_op
# One gradient reduce per mini-batch instead of one per micro-batch: FSDP's
# no_sync() over all but the last micro-batch. Listed here for the same reason as
# the line above -- it is on the gradient path. It is not arithmetic-neutral the
# way the sharding strategy is: the unsharded micro-batch gradients are summed
# first and reduce-scattered once, rather than reduce-scattered and summed as
# shards, so the floating-point association differs. The difference is at
# rounding level and the expectation is unchanged, but it is a real change to how
# the gradient is formed, so it should not be invisible to this file. The three
# arms may adopt it independently (it does not interact with the loss); measured
# at -45 s of a 415 s step here, at the cost of holding the unsharded gradient.
"actor_rollout_ref.actor.no_sync_grad_accum": true
# response_only_logits is pinned for the same reason. Restricting lm_head to the
# response rows computes exactly the values the full projection did -- lm_head is
# per-position, so selecting before or after it is the same arithmetic -- but the
# GEMM changes shape, which moves the last bits like a micro-batch change does.
# Unlike the two above it is NOT a free choice per arm: it sits on the gradient,
# and the pure-OPD arm pins it true (examples/opd_trainer/expected_multitask_config
# .yaml on claude/pure-opd-multitask), so an arm that left it off would differ from
# the arm it is compared against in something other than the loss.
"actor_rollout_ref.actor.response_only_logits": true

# ---- model / optimization -------------------------------------------------------
"actor_rollout_ref.model.path": Qwen/Qwen3-1.7B
"actor_rollout_ref.actor.optim.lr": 1.0e-6
"actor_rollout_ref.actor.optim.lr_warmup_steps_ratio": 0.1
"actor_rollout_ref.actor.ppo_mini_batch_size": 60

# ---- data (per-step composition matches OPD / offline KD) ------------------------
"data.train_batch_size": 45
"data.val_batch_size": 126
"data.seed": 1
"data.max_prompt_length": 4096
"data.max_response_length": 512
"data.truncation": left
"data.task_balance.enable": true
"data.task_balance.per_task_batch_size": 15
"data.task_balance.num_batches": 300
"data.task_balance.tasks": [alfworld, search, webshop]
"data.task_overrides.alfworld.max_prompt_length": 2048
"data.task_overrides.alfworld.truncation": error
"data.task_overrides.search.max_prompt_length": 4096
"data.task_overrides.search.truncation": left
"data.task_overrides.webshop.max_prompt_length": 4096
"data.task_overrides.webshop.truncation": error
"data.apply_chat_template_kwargs.enable_thinking": false

# ---- environment (validation rollouts) ---------------------------------------------
"env.env_name": multitask
"env.seed": 1
"env.max_steps": 50
"env.history_length": 4
"env.rollout.n": 8
"env.multitask.tasks": [alfworld, search, webshop]
"env.multitask.max_steps.alfworld": 50
"env.multitask.max_steps.search": 4
"env.multitask.max_steps.webshop": 15
"env.multitask.history_length.alfworld": 2
"env.multitask.history_length.search": 4
"env.multitask.history_length.webshop": 2
# Accepts one number, as here, or a mapping naming the tasks that differ:
#
#   "env.multitask.val_per_task_batch_size": {alfworld: <n>, search: <n>, webshop: <n>}
#
# alfworld and webshop must stay at 126 whatever else changes -- an environment
# manager is built at this size and alfworld seeds worker i from the game cycle by
# position within it, so a different size scores a different set of games. search
# is indifferent: every row carries its own question and ground truth, and the
# rows and their order are the same either way. Raising it is a throughput change
# (its later turns decode for a handful of trajectories in a slot sized for all of
# them), and raising it means editing this line too -- which is the point of the
# line: the decision gets recorded rather than passed on a command line.
#
# search went 126 -> 252 because that was measured, not assumed: 413 batches
# became 208 and ms/row did not move, because a decode step costs the same
# carrying ten sequences or a hundred. It had been living on a command line
# behind EXPECTED_CONFIG_WAIVE, which is exactly the arrangement this file
# exists to prevent, so it is written down here.
#
# 252 -> 378 was measured and kept: 208 batches became 139, ms/row read 65-66
# against 252's 67 at the same fraction of rows, val/success_rate moved by
# 0.00002, and nothing preempted.
#
# 504 -> 378 AGAIN, PAIRED WITH VAL_PIPELINE_DEPTH=4. The pair is the change:
# the two hold the same number of rows in flight.
#
#   504 x 3 slots = 1512 row-slots      378 x 4 slots = 1512 row-slots
#
# 504 was measured and it worked -- ms/row 75 against 378-at-depth-3's 80 at
# the same fraction of rows, score within 0.00002, nothing preempted. What the
# per-excursion profiler then said is that width is no longer where the loss
# is: 81% of it is a turn's last few rows draining while a whole batch waits
# for a slot, 14% more is a batch ready with the engine empty, and 5% is the
# engine itself. 95% of the loss is that no slot was free, and widening batches
# does not add slots. So the same envelope buys a fourth slot instead.
#
# THE WIDTH IS TIED TO gpu_memory_utilization AND TO DEPTH, AND CANNOT MOVE
# ALONE.
# Peak KV per row of batch width reads 414 (what the 378 estimate implies) to
# 468 (linear in the 252 measurement), and the run cannot tell them apart
# because both fit at 378. At 504:
#
#   0.75 -> 223,900 KV:  93% - 105%   over, or as good as
#   0.80 -> 245,300 KV:  85% -  96%   the top of that is where preemption starts
#   0.85 -> 266,700 KV:  78% -  88%   fits on both readings
#
# 378 x depth 4 asks for exactly the same peak as 504 x depth 3, so it ships
# with the same ROLLOUT_GPU_MEM_UTIL=0.85. eval_checkpoints.sh refuses to start
# if width, depth and budget are inconsistent -- it counts DEPTH now, which it
# did not when 504 landed, and under which 504 x 4 would have passed while
# asking for a third more than the figure the check was calibrated on.
#
# What it is aimed at: everything the driver does ONCE PER BATCH is divided,
# because 208 batches become 105. It does nothing for per-row work and nothing
# for the engine's duty cycle. Judge it on ms/row from the WALL lines at the
# same FRACTION OF ROWS -- s/batch, batch number and [val-hash] are all
# meaningless across a width change, because regrouping the rows IS the change.
"env.multitask.val_per_task_batch_size": {alfworld: 126, search: 378, webshop: 126}

# The retriever policy decides what enters the validation trajectories, so it is
# pinned here rather than left with the machine knobs. Running out of retries does
# NOT fail the run: the client hands the error string back as the retrieval
# result, so "Search error: ..." lands in the <information> block, with nothing in
# the metrics to say it happened. One retriever is shared between the arms, and
# under a shared retriever an exhausted budget is exactly what a load spike looks
# like -- so max_retries is null and the client waits. 4xx and malformed JSON
# still fail at once, since waiting cannot turn those into a document.
#
# timeout stays finite beside it: a peer that goes away without a FIN would
# otherwise leave the socket waiting for the OS default, and a finite timeout
# turns that into a connection error the retry loop handles.
#
# 120, not 600. This bounds only the case a socket option cannot reach -- a
# server that accepted the request and is thinking forever. Everything below
# that is bounded at the socket now: 5 s on connect and 10 s on a request whose
# acknowledgement never arrives (SEARCH_CONNECT_TIMEOUT_S,
# SEARCH_TCP_USER_TIMEOUT_S). The slowest batched search ever measured against
# this retriever is 7.5 s, so 120 is sixteen times the worst observation and
# still five times faster to notice a hang than 600 was.
"env.search.timeout": 120
"env.search.max_retries": null

# ---- rollout sampling / validation protocol ----------------------------------------
"actor_rollout_ref.rollout.temperature": 1.0
"actor_rollout_ref.rollout.val_kwargs_by_task.alfworld.temperature": 0.4
"actor_rollout_ref.rollout.val_kwargs_by_task.alfworld.do_sample": true
"actor_rollout_ref.rollout.val_kwargs_by_task.search.temperature": 0
"actor_rollout_ref.rollout.val_kwargs_by_task.search.do_sample": false
"actor_rollout_ref.rollout.val_kwargs_by_task.webshop.temperature": 0.4
"actor_rollout_ref.rollout.val_kwargs_by_task.webshop.do_sample": true

# ---- when validation happens -------------------------------------------------------
# Never inside the training loop. Validation here is a full agentic rollout, not
# this arm's loss: on the 300-step run that validated at step 150 and 300 it took
# 3.8 h a pass, 18% of the run's 42.5 h wall clock and 68.6% of all the GPU time
# the run left idle (measured, wandb x7g9r7bx). It is run afterwards instead, one
# process per checkpoint, by examples/sft_trainer/eval_checkpoints.sh -- which
# passes THIS file too, so the protocol below is the protocol the checkpoints are
# scored under.
#
# Pinned rather than left with the performance knobs because it decides what a run
# measures, and because -1 is the kind of value that gets "helpfully" restored: a
# test_freq that quietly goes positive again silently reintroduces the 7.6 h and
# splits the evaluation across two mechanisms.
#
# It also has to hold for the eval process: a val_only run returns before the
# training loop, so any positive value there would be dead config, and pinning one
# value for both processes keeps the two from drifting apart.
"trainer.test_freq": -1
# Checkpoints are the evaluation's input, so the cadence that writes them belongs
# next to it: 300 steps at save_freq=25 gives twelve, plus the final step.
"trainer.save_freq": 25

# ---- run identity ------------------------------------------------------------------
"trainer.total_training_steps": 300
"trainer.project_name": verl_agent_sft_multitask
# experiment_name is pinned as part of the run identity: renaming (or reusing a
# name for a different config) requires touching this file next to the knobs.
"trainer.experiment_name": sdar_multitask_sft_multitask_qwen3_1.7b
