# Expected effective config for Stage 2 of off-policy multitask distillation
# (offline KD): the student trained on the fixed teacher-trajectory dataset.
#
# main_opd_offpolicy validates the composed Hydra config against every key
# below AFTER its own config injection (verl/utils/expected_config.py) and
# aborts on any mismatch, so a wrong default / typo'd override / shadowed
# injection fails in seconds instead of producing a mislabeled multi-hour run.
#
# Rules:
#   - Keys are dotted paths into the composed config; values are the expected
#     effective values.
#   - Only SCIENTIFIC knobs live here. Performance knobs (micro batch sizes,
#     offload, prefix caching, max_model_len, ...) are intentionally NOT
#     listed. $HOME-derived paths (parquets, teacher_data_dir) are also not
#     pinned (machine-dependent); the teacher DATASET's own knobs are pinned by
#     the Stage-1 expectations file instead.
#   - To change a setting intentionally: edit the run script AND this file in
#     the same commit. A run-script-only edit will (by design) refuse to start.

# ---- distillation loss: soft targets + hard targets -----------------------------
# The training signal is exactly
#
#     kl_loss_coef * KL(teacher_topk || student) + sft_loss_coef * CE
#
# over the same response tokens and the same mask. The first term is the same
# top-20 dense KL as on-policy OPD; the second is the hard-label cross-entropy on
# the tokens the teacher actually sampled, i.e. the degenerate (one-hot teacher)
# limit of the first.
#
# The two are not on the same scale and do not stay in a fixed ratio: the KL goes
# to 0 as the student matches the teacher, while the CE is bounded below by the
# teacher's own entropy on those tokens. A constant sft_loss_coef therefore takes
# over the gradient as the run converges. That is a property of the objective and
# the reason the coefficient is pinned here rather than treated as a tuning dial:
# two runs with different values are different experiments.
#
# Removing "algorithm.opd.sft_loss_coef" from the run script (rather than setting
# it to 0) turns the CE term off entirely, which is the pure-KD arm. 0.0 is NOT
# the same thing -- it keeps the term and its metrics at zero weight, which is the
# control run for "does the CE matter", so it is taken at face value.
"algorithm.opd.kl_loss_type": topk_kl
"algorithm.opd.kl_loss_coef": 1.0
"algorithm.opd.topk": 20
"algorithm.opd.sft_loss_coef": 1.0
# effective values after main_opd_offpolicy's injection into the actor config
"actor_rollout_ref.actor.use_teacher_kl_loss": true
"actor_rollout_ref.actor.teacher_kl_loss_type": topk_kl
"actor_rollout_ref.actor.teacher_kl_loss_coef": 1.0
"actor_rollout_ref.actor.teacher_kl_topk": 20
"actor_rollout_ref.actor.use_sft_loss": true
"actor_rollout_ref.actor.sft_loss_coef": 1.0

# ---- whose top-k the KL's support is -----------------------------------------------
# Pinned at false because it is not a performance knob: it decides WHICH support
# the coarse-grained reverse KL is exact on, and therefore what is optimised. Two
# runs that disagree on it compare nothing.
#
# false is this arm: the support is the TEACHER's top-20, precomputed by Stage 1
# and carried in the pool, so no teacher runs during training at all. The
# student-indexed arm is a separate run script with its own expectations file
# (expected_multitask_offpolicy_studenttopk_config.yaml), because it also has to
# load the three teachers.
#
# Only the EFFECTIVE actor key is pinned here. algorithm.opd has no schema entry
# -- the run script creates it with "+" -- so pinning a key this run script does
# not pass would fail on a missing key rather than on a wrong value.
"actor_rollout_ref.actor.student_indexed_topk": false

# ---- response-only lm_head ---------------------------------------------------------
# Pinned OFF here, and it is a speed knob rather than a scientific one -- but it is
# NOT bit-identical (a narrower GEMM reduces in a different order), and this arm
# already has a completed 300-step run. Turning it on mid-stream would make later
# steps not bit-comparable with earlier ones of the same experiment name, which is
# the thing this file exists to prevent. The student-indexed arm is new and turns
# it on.
"actor_rollout_ref.actor.response_only_logits": false

# ---- per-task normalisation of the loss above ------------------------------------
# The plain token-mean weights a task by its share of response tokens, measured at
# 69/27/4% for alfworld/webshop/search on these pools purely because of the
# 50/15/4-turn episode caps; the per-row weights in attach_task_loss_weights make
# it 1/3 each. Both terms of the loss are weighted by the same numbers, so the
# kl_loss_coef : sft_loss_coef ratio pinned above is untouched, as are the pool
# sizes, data composition and epoch count.
#
# Pinned rather than left with the throughput knobs because the three arms
# (on-policy OPD, this one, multitask SFT) must agree on it: the SFT arm has
# normalised per task from the start, so a run of this arm without it would make
# the arms differ in the task weighting as well as in the objective, and the
# comparison would not attribute the difference to the loss.
"algorithm.opd.normalize_loss_by_task": true
"actor_rollout_ref.actor.normalize_loss_by_task": true

# ---- distillation invariants (nothing beyond those two terms enters the loss) --
"algorithm.adv_estimator": grpo
"algorithm.use_kl_in_reward": false
"actor_rollout_ref.actor.pg_loss_coef": 0
"actor_rollout_ref.actor.use_kl_loss": false
"actor_rollout_ref.actor.entropy_coeff": 0
"actor_rollout_ref.actor.use_sdl_loss": false
"actor_rollout_ref.actor.use_sdar_loss": false
"actor_rollout_ref.actor.use_invalid_action_penalty": true
"actor_rollout_ref.actor.invalid_action_penalty_coef": 0.1
"actor_rollout_ref.actor.invalid_action_penalty_coef_by_task":
  alfworld: 0.1
  search: 0.01
  webshop: 0.1

# ---- FSDP sharding ----------------------------------------------------------------
# ZeRO-2 rather than the FULL_SHARD default: parameters stay gathered from the
# forward through the backward, so the repeated all-gathers a layer does per
# micro-batch under gradient checkpointing collapse to one. Listed here despite
# being a throughput knob because it is on the gradient path, and a run's identity
# should not depend on something invisible to this file. It is arithmetic-neutral
# -- gradients are reduce-scattered in the same reduce_dtype either way -- so the
# arms may adopt it independently without confounding their comparison.
"actor_rollout_ref.actor.fsdp_config.sharding_strategy": shard_grad_op
# One gradient reduce per mini-batch instead of one per micro-batch: FSDP's
# no_sync() over all but the last micro-batch. Listed here for the same reason as
# the line above -- it is on the gradient path. It is not arithmetic-neutral the
# way the sharding strategy is: the unsharded micro-batch gradients are summed
# first and reduce-scattered once, rather than reduce-scattered and summed as
# shards, so the floating-point association differs. The difference is at
# rounding level and the expectation is unchanged, but it is a real change to how
# the gradient is formed, so it should not be invisible to this file. The arms may
# adopt it independently (it does not interact with the loss).
"actor_rollout_ref.actor.no_sync_grad_accum": true
# forward_prefetch is deliberately NOT here: it only reorders the issue of
# all-gathers that happen either way, so it touches scheduling and not the
# gradient.

# ---- retriever (the search task's only external dependency) -----------------------
# Not the URL -- that is machine-dependent -- but the policy that decides what
# happens when the retriever does not answer in time.
#
# On an exhausted retry budget the client does NOT fail the run: the error text is
# substituted for the retrieved document and becomes the <information> block the
# model sees, with nothing in the metrics to say so. That makes the retry policy a
# property of the DATA, which is why it is pinned here rather than left with the
# performance knobs. max_retries: null retries a timeout / refused connection / 5xx
# until the retriever answers, so no turn can be trained on an error string; 4xx and
# malformed JSON still fail at once, since waiting cannot turn those into a document.
#
# timeout is generous but finite on purpose. null would also wait, but a connection
# that dies without being closed (a retriever restart) then blocks forever with
# nothing to detect it -- and the rollout's turn barrier waits on the slowest env, so
# one dead socket stalls every trajectory in the step. A finite timeout turns that
# into one more retry against the restarted server.
"env.search.timeout": 600
"env.search.max_retries": null

# ---- model / optimization -------------------------------------------------------
"actor_rollout_ref.model.path": Qwen/Qwen3-1.7B
"actor_rollout_ref.actor.optim.lr": 1.0e-6
"actor_rollout_ref.actor.optim.lr_warmup_steps_ratio": 0.1
"actor_rollout_ref.actor.ppo_mini_batch_size": 60

# ---- data (per-step composition matches on-policy OPD) --------------------------
"data.train_batch_size": 45
"data.val_batch_size": 126
"data.seed": 1
"data.max_prompt_length": 4096
"data.max_response_length": 512
"data.truncation": left
"data.task_balance.enable": true
"data.task_balance.per_task_batch_size": 15
"data.task_balance.num_batches": 300
"data.task_balance.tasks": [alfworld, search, webshop]
"data.task_overrides.alfworld.max_prompt_length": 2048
"data.task_overrides.alfworld.truncation": error
"data.task_overrides.search.max_prompt_length": 4096
"data.task_overrides.search.truncation": left
"data.task_overrides.webshop.max_prompt_length": 4096
"data.task_overrides.webshop.truncation": error
"data.apply_chat_template_kwargs.enable_thinking": false

# ---- environment (validation rollouts) ---------------------------------------------
"env.env_name": multitask
"env.seed": 1
"env.max_steps": 50
"env.history_length": 4
"env.rollout.n": 8
"env.multitask.tasks": [alfworld, search, webshop]
"env.multitask.max_steps.alfworld": 50
"env.multitask.max_steps.search": 4
"env.multitask.max_steps.webshop": 15
"env.multitask.history_length.alfworld": 2
"env.multitask.history_length.search": 4
"env.multitask.history_length.webshop": 2
"env.multitask.val_per_task_batch_size": 126

# ---- rollout sampling / validation protocol ----------------------------------------
"actor_rollout_ref.rollout.temperature": 1.0
"actor_rollout_ref.rollout.val_kwargs_by_task.alfworld.temperature": 0.4
"actor_rollout_ref.rollout.val_kwargs_by_task.alfworld.do_sample": true
"actor_rollout_ref.rollout.val_kwargs_by_task.search.temperature": 0
"actor_rollout_ref.rollout.val_kwargs_by_task.search.do_sample": false
"actor_rollout_ref.rollout.val_kwargs_by_task.webshop.temperature": 0.4
"actor_rollout_ref.rollout.val_kwargs_by_task.webshop.do_sample": true

# ---- run identity ------------------------------------------------------------------
"trainer.total_training_steps": 300
"trainer.project_name": verl_agent_opd_offpolicy_multitask
# experiment_name is pinned as part of the run identity: renaming (or reusing a
# name for a different config) requires touching this file next to the knobs.
"trainer.experiment_name": sdar_multitask_offline_qwen3_1.7b
