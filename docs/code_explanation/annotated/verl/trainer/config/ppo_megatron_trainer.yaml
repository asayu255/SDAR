    # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
    enable_gradient_checkpointing: False
    # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
    gradient_checkpointing_kwargs:
      ## Activation Checkpointing
