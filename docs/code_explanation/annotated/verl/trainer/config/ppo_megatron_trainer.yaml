      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      temperature: 0
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      n: 1
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      do_sample: False # default eager for validation
    # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
    multi_turn: 
