# [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
name: utils_gpu_test

# [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
on:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
  push:
    # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
    branches:
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - main
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - v0.*
  # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
  pull_request:
    # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
    branches:
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - main
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - v0.*
    # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
    paths:
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - "**/*.py"
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - .github/workflows/utils_gpu_test.yml
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - "!recipe/**/*.py"

# Cancel jobs on the same ref if a new one is triggered
# [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
concurrency:
  # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
  group: ${{ github.workflow }}-${{ github.ref }}
  # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Declare permissions just read content.
# [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
permissions:
  # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
  contents: read

# [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
jobs:
  # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
  utils_gpu_test:
    # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
    runs-on: [L20x8]
    # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
    timeout-minutes: 20 # Increase this timeout value as needed
    # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
    container:
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      image: whatcanyousee/verl:ngc-cu124-vllm0.8.5-sglang0.4.6-mcore0.12.0-te2.3
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      options: --gpus all --shm-size=10g
    # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
    steps:
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - name: Set up Python ${{ matrix.python-version }}
        # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
        with:
          # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
          python-version: ${{ matrix.python-version }}
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - name: Install the current repository
        # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
        run: |
          pip install -e .[test]
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - name: Running utils gpu tests
        # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
        run: |
          cd tests/utils/gpu_tests
          pytest -s -x --ignore=dataset/ --ignore=checkpoint/ .