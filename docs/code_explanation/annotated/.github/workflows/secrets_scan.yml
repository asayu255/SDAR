  test:
    # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
    runs-on: ubuntu-latest
    # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
    steps:
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - name: Checkout code
        # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
