# [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
name: e2e_prime

# [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
on:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
  push:
    # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
    branches:
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - disabled_ci
  # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
  pull_request:
    # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
    branches:
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - disabled_ci
    # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
    paths:
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - "**/*.py"
      # Other entrypoints
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - "!examples/**"
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - "!tests/**"
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - "!verl/trainer/main_*.py"
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - "!verl/trainer/fsdp_sft_trainer.py"
      # Other recipes
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - "!recipe/**"
      # Megatron
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - "!verl/workers/**/megatron_*.py"
      # Home
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - "recipe/prime"
      # Entrypoints
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - ".github/workflows/e2e_prime.yml"
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - "examples/data_preprocess/gsm8k.py"
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - "tests/e2e/run_prime.sh"

# Cancel jobs on the same ref if a new one is triggered
# [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
concurrency:
  # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
  group: ${{ github.workflow }}-${{ github.ref }}
  # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Declare permissions just read content.
# [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
permissions:
  # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
  contents: read

# [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
jobs:
  # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
  e2e_prime:
    # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
    runs-on: [L20x8]
    # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
    timeout-minutes: 50 # Increase this timeout value as needed
    # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
    env:
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      HTTP_PROXY: ${{ secrets.PROXY_HTTP }}
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      HTTPS_PROXY: ${{ secrets.PROXY_HTTPS }}
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      NO_PROXY: "localhost,127.0.0.1,hf-mirror.com"
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      HF_ENDPOINT: "https://hf-mirror.com"
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      HF_HUB_ENABLE_HF_TRANSFER: "0" # This is more stable
    # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
    container:
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      image: whatcanyousee/verl:ngc-cu124-vllm0.8.5-sglang0.4.6-mcore0.12.0-te2.3
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      options: --gpus all --shm-size=10g
    # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
    steps:
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
        with:
          # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
          fetch-depth: 0
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - name: Install the current repository
        # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
        run: |
          pip3 install --no-deps -e .[test,gpu]
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - name: Prepare gsm8k dataset
        # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
        run: |
          ray stop --force
          python3 examples/data_preprocess/gsm8k.py
      # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
      - name: Running GSM8K E2E with prime alg
        # [EXPLAIN] この設定項目の値を、entry point または worker が読み取る構成として定義する。
        run: |
          ray stop --force
          bash tests/e2e/run_prime.sh
